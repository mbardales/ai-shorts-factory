# Docker Compose para DESARROLLO LOCAL de n8n Community Edition
#
# Este archivo es ÚNICAMENTE para desarrollo local.
# Para producción (Northflank) usar el Dockerfile de esta carpeta
# (ver README.md, sección "Producción (Northflank)").
#
# Incluye:
#   - n8n Community Edition (imagen oficial) con PostgreSQL como base de datos.
#   - Volumen persistente para los datos de n8n y para PostgreSQL.
#   - Variables de entorno cargadas desde el archivo .env (ver .env.example).
#
# Uso:
#   1. Copiar .env.example a .env y completar los valores.
#   2. Ejecutar: docker compose up -d
#   3. Acceder a n8n en: http://localhost:${N8N_PORT} (por defecto 5678)

name: ai-shorts-factory

services:
  # ---------------------------------------------------------------------------
  # PostgreSQL: base de datos de n8n (workflows, credenciales, datos de ejecución)
  # ---------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: n8n-postgres
    restart: unless-stopped
    environment:
      # Credenciales tomadas del archivo .env. No usar valores reales en el repo.
      POSTGRES_USER: ${POSTGRES_USER:-n8n}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-n8n}
    volumes:
      # Persistencia de la base de datos en el volumen nombrado "postgres_data".
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      # Verifica que PostgreSQL esté listo antes de que n8n intente conectarse.
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-n8n} -d ${POSTGRES_DB:-n8n}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ---------------------------------------------------------------------------
  # n8n: servidor de automatización (Community Edition, imagen oficial)
  # ---------------------------------------------------------------------------
  n8n:
    image: n8nio/n8n:latest
    container_name: n8n
    restart: unless-stopped
    ports:
      # El puerto del host se define en .env; dentro del contenedor n8n usa 5678.
      - "${N8N_PORT:-5678}:5678"
    environment:
      # --- Acceso y red (valores locales; ajustar en producción) ---
      N8N_HOST: ${N8N_HOST:-localhost}
      N8N_PORT: 5678
      N8N_PROTOCOL: ${N8N_PROTOCOL:-http}
      WEBHOOK_URL: ${WEBHOOK_URL:-http://localhost:5678/}
      # false porque local usa HTTP; en producción con HTTPS debe ser true.
      N8N_SECURE_COOKIE: ${N8N_SECURE_COOKIE:-false}
      # 0 en local; en producción detrás de proxy/CDN usar el número de hops.
      N8N_PROXY_HOPS: ${N8N_PROXY_HOPS:-0}
      # --- Seguridad ---
      # Clave de cifrado de credenciales: obligatoria y única. Si se pierde,
      # n8n no puede leer las credenciales guardadas. Generarla con
      # "openssl rand -hex 32" y guardarla de forma segura.
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY}
      # --- Base de datos (host interno "postgres" del Compose local) ---
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: ${DB_POSTGRESDB_HOST:-postgres}
      DB_POSTGRESDB_PORT: ${DB_POSTGRESDB_PORT:-5432}
      DB_POSTGRESDB_DATABASE: ${POSTGRES_DB:-n8n}
      DB_POSTGRESDB_USER: ${POSTGRES_USER:-n8n}
      DB_POSTGRESDB_PASSWORD: ${POSTGRES_PASSWORD}
      # --- Ejecución y retención ---
      GENERIC_TIMEZONE: ${GENERIC_TIMEZONE:-UTC}
      N8N_DEFAULT_LOCALE: ${N8N_DEFAULT_LOCALE:-es}
      EXECUTIONS_DATA_PRUNE: ${EXECUTIONS_DATA_PRUNE:-true}
      EXECUTIONS_DATA_MAX_AGE: ${EXECUTIONS_DATA_MAX_AGE:-336}
      EXECUTIONS_DATA_PRUNE_MAX_COUNT: ${EXECUTIONS_DATA_PRUNE_MAX_COUNT:-50000}
      N8N_DEFAULT_BINARY_DATA_MODE: ${N8N_DEFAULT_BINARY_DATA_MODE:-default}
      # --- Privacidad y diagnóstico ---
      N8N_DIAGNOSTICS_ENABLED: ${N8N_DIAGNOSTICS_ENABLED:-false}
      N8N_PERSONALIZATION_ENABLED: ${N8N_PERSONALIZATION_ENABLED:-false}
      N8N_VERSION_NOTIFICATIONS_ENABLED: ${N8N_VERSION_NOTIFICATIONS_ENABLED:-false}
      # --- Runners (recomendado activado por defecto) ---
      N8N_RUNNERS_ENABLED: ${N8N_RUNNERS_ENABLED:-true}
    volumes:
      # Persistencia del directorio de datos de n8n (archivos, activos, backups).
      - n8n_data:/home/node/.n8n
    depends_on:
      postgres:
        condition: service_healthy

# -----------------------------------------------------------------------------
# Volúmenes nombrados: sobreviven a "docker compose down" (no así a "down -v")
# -----------------------------------------------------------------------------
volumes:
  postgres_data:
    name: n8n-postgres-data
  n8n_data:
    name: n8n-data
